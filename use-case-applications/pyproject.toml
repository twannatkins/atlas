[project]
name = "atlas-workshop-2"
version = "0.1.0"
description = "ATLAS Workshop 2: AgentCore-native agents and UIs over a FIBO-aligned semantic layer."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT-0"}
dependencies = [
    # AWS SDK and AgentCore
    "boto3>=1.43.0",
    "botocore>=1.43.0",
    "bedrock-agentcore>=1.11.0",
    "strands-agents>=1.41.0",
    "strands-agents-tools>=0.5.0",
    # Semantic web / RDF
    "rdflib>=7.0.0",
    "pyshacl>=0.25.0",
    "SPARQLWrapper>=2.0.0",
    # Standard utilities
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "moto>=5.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["agents", "mcp-servers"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib --tb=short -q"
