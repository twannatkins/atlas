# ATLAS Workshop 2 — FIBO-shaped GraphQL Schema
#
# Every type in this schema maps to exactly one ontology class from
# Workshop 1 (atlas:) or Workshop 2 (atlas-part-2:). Field names are
# camelCase versions of the ontology property local names.
#
# This schema is consumed by both the Wholesale UI and the Wealth UI.
# The differences between the two UIs are in which fragments they query,
# not in the schema itself. This is Thesis 2: two UIs, one backbone.

# AppSync built-in scalars used in place of custom scalars:
#   AWSDateTime — ISO 8601 timestamp (replaces custom DateTime)
#   Float       — IEEE 754 double (replaces custom Decimal; AppSync has no Decimal built-in)
#   AWSURL      — URL/IRI string (replaces custom URI)

# ─────────────────────────────────────────────────────────────────────
# Provenance — every entity that carries audit trail
# ─────────────────────────────────────────────────────────────────────

type Provenance {
  """The SHACL shape that validated this entity"""
  validatedBy: String
  """The R2RML mapping that produced the underlying triple"""
  derivedFrom: String
  """The agent or process that generated this entity"""
  generatedBy: String
  """When this entity was generated"""
  generatedAtTime: AWSDateTime
  """The data source that contributed the raw observation"""
  sourceDataset: String
}

# ─────────────────────────────────────────────────────────────────────
# Core types — from Workshop 1 ontology (atlas:)
# ─────────────────────────────────────────────────────────────────────

"""
atlas:Customer — A party holding an active relationship with the institution.
FIBO alignment: fibo-fnd-pty-pty:IndependentParty
"""
type Customer {
  uri: ID!
  customerId: String!
  label: String
  accounts: [Account!]!
  household: Household
  wealthSignals: [WealthSignal!]!
  advisoryRelationships: [AdvisoryRelationship!]!
  eligibility: Eligibility
  previousSurfacings: [PreviousSurfacing!]!
  provenance: Provenance
}

"""
atlas:Account — A financial account held by a Customer.
FIBO alignment: fibo-fbc-pas-fpas:FinancialAccount
"""
type Account {
  uri: ID!
  accountId: String!
  accountType: String!
  balanceUSD: Float
  holdings: [Holding!]!
  transactions(limit: Int = 50): [Transaction!]!
  provenance: Provenance
}

"""
atlas:Holding — A position in a financial instrument.
FIBO alignment: fibo-fbc-fi-ip:InvestmentPosition
"""
type Holding {
  uri: ID!
  label: String
  provenance: Provenance
}

"""
atlas:Transaction — A discrete financial event against an Account.
"""
type Transaction {
  uri: ID!
  transactionDate: AWSDateTime!
  amountUSD: Float!
  transactionType: String!
  provenance: Provenance
}

"""
atlas:Household — A grouping of Customers sharing a residential unit.
"""
type Household {
  uri: ID!
  label: String
  members: [Customer!]!
  memberCount: Int!
  provenance: Provenance
}

"""
atlas:WealthSignal — An observation indicating wealth-management eligibility.
"""
type WealthSignal {
  uri: ID!
  signalType: String!
  signalDate: AWSDateTime
  strength: String
  evidencedBy: [Transaction!]!
  score: Score
  observationWindow: ObservationWindow
  provenance: Provenance
}

"""
atlas:Score — A probabilistic-explainable numeric score.
"""
type Score {
  uri: ID!
  scoreValue: Float!
  isProbabilistic: Boolean!
  hasExplainability: Boolean!
  modelVersion: String
  confidence: Float
}

"""
atlas:ObservationWindow — A time-bounded evaluation window.
"""
type ObservationWindow {
  uri: ID!
  startDate: AWSDateTime!
  endDate: AWSDateTime!
}

"""
atlas:Eligibility — A determination that a Customer meets referral criteria.
"""
type Eligibility {
  uri: ID!
  routingDecision: RoutingDecision
  provenance: Provenance
}

"""
atlas:RoutingDecision — A decision to route a signal to a downstream handler.
"""
type RoutingDecision {
  uri: ID!
  selectedRoute: String!
  humanReview: HumanReview
  workflowStep: WorkflowStep
  provenance: Provenance
}

"""
atlas:HumanReview — A human reviewer's decision on a routed lead.
"""
type HumanReview {
  uri: ID!
  reviewOutcome: String!
  reviewDate: AWSDateTime!
  reviewer: Advisor
  provenance: Provenance
}

"""
atlas:Advisor — A wealth-management advisor.
"""
type Advisor {
  uri: ID!
  label: String!
  specialization: String
  currentCapacity: Int
  advisoryRelationships: [AdvisoryRelationship!]!
}

"""
atlas:AdvisoryRelationship — A standing advisory coverage assignment.
"""
type AdvisoryRelationship {
  uri: ID!
  customer: Customer!
  advisor: Advisor!
  coverageStartDate: AWSDateTime!
  coverageEndDate: AWSDateTime
  relationshipType: String!
  lineOfBusiness: String
  isActive: Boolean!
  provenance: Provenance
}

"""
atlas:AuditRecord — A PROV-O-attributed provenance record.
"""
type AuditRecord {
  uri: ID!
  aboutHousehold: Household
  routingDecision: RoutingDecision
  targetAdvisor: Advisor
  generatedAtTime: AWSDateTime!
  workflowStatus: String!
  provenance: Provenance
}

"""
atlas:WorkflowStep — A step in the routing state machine.
"""
type WorkflowStep {
  uri: ID!
  label: String
  status: String
}

"""
atlas:PreviousSurfacing — A historical wealth-candidate evaluation.
"""
type PreviousSurfacing {
  uri: ID!
  outcome: String!
  surfacingDate: AWSDateTime!
}

# ─────────────────────────────────────────────────────────────────────
# Workshop 2 extension types — from atlas-part-2: namespace
# ─────────────────────────────────────────────────────────────────────

"""
atlas-part-2:Referral — The business-facing noun for a routing event.
"""
type Referral {
  uri: ID!
  household: Household!
  signals: [WealthSignal!]!
  approvedRationale: String!
  routingDecision: RoutingDecision
  originatedBy: String!
  referralDate: AWSDateTime!
  provenance: Provenance
}

"""
atlas-part-2:ThemeAssertion — A market or portfolio theme (Phase 2).
"""
type ThemeAssertion {
  uri: ID!
  themeLabel: String!
  themeDate: AWSDateTime
  sourceArticles: [String!]!
  appliesTo: [Customer!]!
}

# ─────────────────────────────────────────────────────────────────────
# Capability palette — from Agent Registry
# ─────────────────────────────────────────────────────────────────────

"""
A registered capability (agent or MCP server) discoverable by the current persona.
Populated live from the Agent Registry, never hardcoded.
"""
type Capability {
  name: String!
  displayName: String!
  displayIcon: String!
  posture: String!
  capabilityTag: String!
  phase: Int!
}

# ─────────────────────────────────────────────────────────────────────
# Queries
# ─────────────────────────────────────────────────────────────────────

"""
Result of a natural-language query (Ask the graph). nl-to-sparql-agent embeds the
question, matches it against a fixed set of validated SPARQL templates (ground-truth.yaml,
cosine >= 0.75), and runs the matched template — it NEVER free-generates SPARQL. So the
answer is bounded by the template set; an unmatched question returns status
"no_template_match" with empty rows (the UI then shows the answerable questions).
"""
type NlQueryResult {
  """ "success" | "no_template_match" | "execution_error" — render honestly, never fabricate. """
  status: String!
  """The validated SPARQL that ran (null when no template matched)."""
  sparql: String
  """The result rows as JSON — heterogeneous across templates, so an opaque AWSJSON array."""
  result: AWSJSON
  """Which template matched (provenance)."""
  templateId: String
  executionTimeMs: Int
}

"""
A probabilistic, human-in-the-loop draft from referral-rationale-drafter (Bedrock),
grounded in the household's REAL signals. Always carries isProbabilistic +
requiresHumanReview true — it is never auto-routed; a banker must review and approve.
"""
type DraftResult {
  status: String!
  draftNarrative: String
  isProbabilistic: Boolean!
  requiresHumanReview: Boolean!
  """The model that produced the draft (provenance)."""
  generatedBy: String
}

"""
Result of a single conversational turn (the Wealth UI's Ask-the-graph). converse routes
through conversational-context-manager, which wraps nl-to-sparql-agent (the same
template-bounded NL->SPARQL as askGraph). It is honestly SINGLE-TURN: priorTurns is
always 0 because AgentCore Memory is not wired (get_memory/put_memory are not real ops),
so each question is answered independently — surfaced in the data, not just the copy.
"""
type ConverseResult {
  status: String!
  """The validated SPARQL that ran (null when no template matched)."""
  sparql: String
  """The result rows as JSON — heterogeneous across templates (opaque AWSJSON array)."""
  result: AWSJSON
  """Prior conversation turns applied. Always 0 — the conversation is single-turn today."""
  priorTurns: Int!
}

type Query {
  """Fetch a customer by URI. Resolver: SPARQL via Ontop."""
  customer(uri: ID!): Customer

  """Fetch a household by URI. Resolver: SPARQL via Ontop."""
  household(uri: ID!): Household

  """Search customers by name or ID. Resolver: SPARQL via Ontop."""
  searchCustomers(query: String!, limit: Int = 20): [Customer!]!

  """Fetch wealth signals for a customer. Resolver: Direct Neptune SPARQL."""
  wealthSignals(customerUri: ID!): [WealthSignal!]!

  """Fetch advisory relationships for a customer. Resolver: Direct Neptune SPARQL."""
  advisoryRelationships(customerUri: ID!): [AdvisoryRelationship!]!

  """Fetch referrals for a household. Resolver: Direct Neptune SPARQL."""
  referrals(householdUri: ID!): [Referral!]!

  """Fetch the capability palette for the current persona. Resolver: atlas-registry-mcp."""
  capabilities(personaClaim: String!): [Capability!]!

  """Fetch audit trail for a routing decision. Resolver: Direct Neptune SPARQL."""
  auditTrail(routingDecisionUri: ID!): [AuditRecord!]!

  """Resolve a source-system ID to a canonical URI. Resolver: atlas-er-mcp."""
  resolveEntity(sourceSystem: String!, sourceId: String!): Customer

  """Fetch themes for the Wealth UI (Phase 2). Resolver: Direct Neptune SPARQL."""
  themes(limit: Int = 10): [ThemeAssertion!]!

  """
  Ask the graph in natural language. Resolver invokes nl-to-sparql-agent (template-bounded
  NL->SPARQL; free generation is forbidden). Returns real rows for a matched template, or
  status "no_template_match" — the UI then offers suggestedQuestions.
  """
  askGraph(question: String!): NlQueryResult!

  """
  The questions Ask-the-graph can actually answer — read live from the SAME ground-truth.yaml
  the agent matches against (zero drift). The UI renders these as suggestions / the no-match
  state, so the input is never a bare "ask anything" box.
  """
  suggestedQuestions: [String!]!
}

# ─────────────────────────────────────────────────────────────────────
# Mutations
# ─────────────────────────────────────────────────────────────────────

type Mutation {
  """
  Invoke the referral-orchestrator workflow.
  Requires: approved rationale (human must approve before calling this).
  Only callable by atlas-consumer-banker persona.
  """
  routeReferral(
    householdUri: ID!
    signalUris: [ID!]!
    approvedRationale: String!
    originatingBankerId: String!
  ): Referral

  """
  Invoke the wealth-signal-detector for a target.
  Returns newly minted signals.
  """
  detectSignals(
    targetUri: ID!
    signalTypes: [String!]
  ): [WealthSignal!]!

  """
  Draft a referral rationale from a household's real signals. Resolver invokes
  referral-rationale-drafter (Bedrock). The draft is probabilistic and REQUIRES human
  review — it is not a routing action. The banker reviews/edits it, then routeReferral
  (the deterministic, human-gated path) performs the actual routing.
  """
  draftRationale(householdUri: ID!, signalUris: [ID!]!): DraftResult!

  """
  Ask a single natural-language question in the Wealth UI conversation. Resolver invokes
  conversational-context-manager (which wraps nl-to-sparql-agent). Single-turn: sessionId
  is carried for the agent contract but no prior-turn memory is applied (priorTurns is
  always 0). Returns real rows for a matched template, or status "no_template_match".
  """
  converse(question: String!, sessionId: String!): ConverseResult!
}

# ─────────────────────────────────────────────────────────────────────
# Subscriptions (Phase 2)
# ─────────────────────────────────────────────────────────────────────

type Subscription {
  """Subscribe to new signals for a customer (Phase 2, real-time pattern)."""
  onNewSignal(customerUri: ID!): WealthSignal
}
